<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Sign In — X-ONU-SFPP Dashboard</title>

    <script src="/static/theme.js"></script>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/login.css">
    <script src="/static/login.js" defer></script>
</head>
<body class="xonu-login">
    <main class="login-shell">
        <section class="login-card"
                 aria-labelledby="loginTitle">

            <p class="eyebrow">XGS-PON TELEMETRY</p>

            <h1 id="loginTitle">X-ONU-SFPP</h1>

            <p class="login-description">
                Sign in to your dashboard
            </p>

            <form id="loginForm">
                <label for="loginUsername">
                    Username
                </label>
                <input
                    id="loginUsername"
                    name="username"
                    type="text"
                    autocomplete="username"
                    maxlength="1024"
                    required
                    autofocus>

                <label for="loginPassword">
                    Password
                </label>
                <input
                    id="loginPassword"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    maxlength="1024"
                    required>

                <label class="remember-choice"
                       for="rememberBrowser">
                    <input
                        id="rememberBrowser"
                        type="checkbox">
                    <span>
                        Remember this browser
                    </span>
                </label>

                <label for="rememberDays">
                    Remember for
                </label>

                <select id="rememberDays" disabled>
                    <option value="1">1 day</option>
                    <option value="3">3 days</option>
                    <option value="7" selected>7 days (default)</option>
                    <option value="14">14 days</option>
                    <option value="30">30 days</option>
                </select>

                <p class="login-note">
                    Only select this on a browser you trust.
                    Sessions expire automatically.
                </p>

                <p id="loginError"
                   class="login-error"
                   role="alert"
                   aria-live="polite"
                   hidden></p>

                <button id="loginSubmit"
                        type="submit">
                    Sign in
                </button>
            </form>

            <p class="login-footer">
                Protected dashboard access
            </p>
        </section>
    </main>
</body>
</html>
