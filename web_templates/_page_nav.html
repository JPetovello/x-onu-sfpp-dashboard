<nav
    class="dashboard-settings-nav"
    aria-label="Dashboard sections">

    <a
        href="/"
        class="settings-nav-link"
        {% if active_page == "dashboard" %}
        aria-current="page"
        {% endif %}>
        Dashboard
    </a>

    <a
        href="/advanced"
        class="settings-nav-link"
        {% if active_page == "advanced" %}
        aria-current="page"
        {% endif %}>
        Advanced
    </a>

    <a
        href="/diagnostics"
        class="settings-nav-link"
        {% if active_page == "diagnostics" %}
        aria-current="page"
        {% endif %}>
        Diagnostics
    </a>

    <a
        href="/alerts-settings"
        class="settings-nav-link"
        {% if active_page == "alerts" %}
        aria-current="page"
        {% endif %}>
        Alerts & Notifications
    </a>

    <a
        href="/alert-history"
        class="settings-nav-link"
        {% if active_page == "history" %}
        aria-current="page"
        {% endif %}>
        Alert History
    </a>

    {% if browser_auth_enabled %}
    <a
        href="/trusted-browsers"
        class="settings-nav-link"
        {% if active_page == "sessions" %}
        aria-current="page"
        {% endif %}>
        Trusted Browsers
    </a>

    <button
        id="xonuLogoutButton"
        class="settings-nav-link xonu-logout-button"
        type="button">
        Sign out
    </button>
    {% endif %}
</nav>
